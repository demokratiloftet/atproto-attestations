version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directories: ["/", "/pilot-fixture"]
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      oxc-toolchain:
        patterns: ["ultracite", "oxlint", "oxfmt", "oxlint-tsgolint"]
